---
layout: default
---

<article>
  <h1>{{ page.title }}</h1>
  {% include post-date.html %}
  <div class="post-content">
    {{ content }}
  </div>
  <nav class="post-nav">
    {% if page.previous.url %}
      <div class="post-nav-item">
        <span class="post-nav-label">Previous</span>
        <a class="post-nav-title" href="{{ site.baseurl }}{{ page.previous.url }}">{{ page.previous.title }}</a>
      </div>
    {% endif %}
    {% if page.next.url %}
      <div class="post-nav-item post-nav-item--next">
        <span class="post-nav-label">Next</span>
        <a class="post-nav-title" href="{{ site.baseurl }}{{ page.next.url }}">{{ page.next.title }}</a>
      </div>
    {% endif %}
  </nav>
</article>
