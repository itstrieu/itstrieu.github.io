<article class="post-card">
  <a href="{{ site.github.url }}{{ post.url }}">
    <h2>{{ post.title }}</h2>
    {% if post.description %}
      <p class="post-excerpt">{{ post.description }}</p>
    {% endif %}
    <span class="post-meta">{{ post.date | date: "%B %-d, %Y" }}</span>
  </a>
</article>
